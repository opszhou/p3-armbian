#==========================================================================
# Description: Publish firmware — rebuild with patched kernel, split per
#              firmware directory structure, upload as separate images
#==========================================================================

name: 发布固件 (Publish Firmware)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Etc/UTC

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    name: publish-firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download latest p3-wxy4 image
        id: down
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        run: |
          mkdir -p build/output/images

          latest_version=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases?per_page=30 | \
              jq -r '[.[] | select(.tag_name | contains("Armbian_"))] |
              map(.assets[] | select(.name | contains("p3-wxy4") and endswith(".img.gz"))) |
              sort_by(.updated_at) |
              reverse |
              .[0] |
              {data: .updated_at, url: .url, name: .name}')

          [[ -z "${latest_version}" || "${latest_version}" == "null" ]] && {
              echo "Error: Failed to resolve p3-wxy4 image download URL."
              exit 1
          }

          latest_url="$(echo ${latest_version} | jq -r '.url')"
          armbian_filename="$(echo ${latest_version} | jq -r '.name')"

          echo "Downloading: ${armbian_filename}"
          curl -fsSL \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "${latest_url}" \
               -o "build/output/images/${armbian_filename}"
          [[ "${?}" -ne "0" ]] && echo "Error: Download failed." && exit 1

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild with patched kernel
        uses: ./
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: p3-wxy4
          armbian_kernel: 6.12.y_6.18.y
          auto_kernel: true
          kernel_repo: opszhou/p3-armbian
          kernel_usage: stable
          armbian_fstype: ext4
          builder_name: ophub

      - name: Split firmware images
        id: split
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          set -e
          SPLIT_DIR="/builder/split"
          mkdir -p "${SPLIT_DIR}" build/output/split

          # Source: the rebuilt full image (gzip)
          FULL_GZ=$(ls ${PACKAGED_OUTPUTPATH}/*.img.gz | head -n 1)
          [[ -e "${FULL_GZ}" ]] || { echo "Error: rebuilt image not found."; exit 1; }
          echo "Full image: ${FULL_GZ} ($(du -m ${FULL_GZ} | cut -f1)MB)"

          # Unzip to raw image
          gzip -dc "${FULL_GZ}" > "${SPLIT_DIR}/full.img"

          # Read partition layout dynamically
          LOOP=$(losetup -Pf --show "${SPLIT_DIR}/full.img")
          sfdisk -d "${LOOP}" > /tmp/layout || true
          echo "--- partition table ---"
          cat /tmp/layout

          P1_START=$(grep -oP 'img1\s*:\s*start=\s*\K\d+' /tmp/layout)
          P1_SIZE=$(grep -oP 'img1\s*:.*?size=\s*\K\d+' /tmp/layout)
          P2_START=$(grep -oP 'img2\s*:\s*start=\s*\K\d+' /tmp/layout)
          P2_SIZE=$(grep -oP 'img2\s*:.*?size=\s*\K\d+' /tmp/layout)
          [[ -n "${P1_START}" && -n "${P2_START}" ]] || { echo "Error: partition parse failed."; losetup -d ${LOOP}; exit 1; }
          echo "p1: start=${P1_START} size=${P1_SIZE} | p2: start=${P2_START} size=${P2_SIZE}"

          # 02_boot.img / 03_rootfs.img — raw partition images
          dd if=${LOOP} of="${SPLIT_DIR}/02_boot.img" bs=512 skip=${P1_START} count=${P1_SIZE} conv=fsync status=none
          dd if=${LOOP} of="${SPLIT_DIR}/03_rootfs.img" bs=512 skip=${P2_START} count=${P2_SIZE} conv=fsync status=none
          losetup -d ${LOOP}

          # Sanity check: both partition images mount
          M=/mnt/split_check; mkdir -p ${M}
          mount -o loop,ro "${SPLIT_DIR}/02_boot.img" ${M}
          ls ${M}/extlinux/extlinux.conf > /dev/null && echo "02_boot mount OK"
          umount ${M}
          mount -o loop,ro "${SPLIT_DIR}/03_rootfs.img" ${M}
          ls ${M}/etc/os-release > /dev/null && echo "03_rootfs mount OK"
          ls ${M}/lib/modules/ && echo "modules OK"
          umount ${M}

          # 01 bootloader images (static, from repo) + slim full image + checksums
          cp -v p3/flashkit/01_gpt_bootarea_l10h.img p3/flashkit/01_gpt_bootarea_l10g.img p3/flashkit/p3boot "${SPLIT_DIR}/"
          cp "${FULL_GZ}" "${SPLIT_DIR}/p3_armbian_slim.img.gz"

          cd "${SPLIT_DIR}"
          sha256sum 01_gpt_bootarea_l10h.img 01_gpt_bootarea_l10g.img p3boot 02_boot.img 03_rootfs.img p3_armbian_slim.img.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd - > /dev/null

          cp -f "${SPLIT_DIR}"/* build/output/split/
          echo "FIRMWARE_TAG=firmware_$(date +%Y.%m)" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload split firmware to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.split.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.FIRMWARE_TAG }}
          artifacts: build/output/split/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### P3 固件分镜像（L10 双模式套件，内核已含 HDMI/CEC/自愈）
            | 文件 | 用途 |
            |---|---|
            | 01_gpt_bootarea_l10h.img / _l10g.img | GPT + L10 引导（二选一：日常 l10h，反复刷机 l10g） |
            | 02_boot.img | boot 分区（补丁内核 + 修正魔数 dtb）`wl 0x8000` |
            | 03_rootfs.img | rootfs 分区 `wl 0xC8000` |
            | p3_armbian_slim.img.gz | U 盘整盘镜像（Rufus/Etcher 写入） |
            | p3boot | p3boot 辅助引导 |
            - 刷机命令与校验见 `p3/flashkit/README.md`
            - SHA256SUMS.txt 覆盖以上全部文件
