#==========================================================================
# Description: Publish firmware — rebuild with patched kernel, split per
#              firmware directory structure, upload as separate images
#==========================================================================

name: 发布固件 (Publish Firmware)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Etc/UTC

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    name: publish-firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download latest p3-wxy4 image
        id: down
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        run: |
          mkdir -p build/output/images

          latest_version=""
          for attempt in 1 2 3 4 5; do
              latest_version=$(curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  https://api.github.com/repos/${{ github.repository }}/releases?per_page=30 | \
                  jq -r '[.[] | select(.tag_name | contains("Armbian_"))] |
                  map(.assets[] | select(.name | contains("p3-wxy4") and endswith(".img.gz"))) |
                  sort_by(.updated_at) |
                  reverse |
                  .[0] |
                  {data: .updated_at, url: .url, name: .name}' 2>/dev/null || true)
              [[ -n "${latest_version}" && "${latest_version}" != "null" ]] && break
              echo "Resolve attempt ${attempt} failed, retrying in 30s..."
              sleep 30
          done

          [[ -z "${latest_version}" || "${latest_version}" == "null" ]] && {
              echo "Error: Failed to resolve p3-wxy4 image download URL."
              exit 1
          }

          latest_url="$(echo ${latest_version} | jq -r '.url')"
          armbian_filename="$(echo ${latest_version} | jq -r '.name')"

          echo "Downloading: ${armbian_filename}"
          curl -fsSL \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               "${latest_url}" \
               -o "build/output/images/${armbian_filename}"
          [[ "${?}" -ne "0" ]] && echo "Error: Download failed." && exit 1

          # Resolve the concrete kernel version from the kernel_stable release
          KERNEL_VER=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/tags/kernel_stable | \
              jq -r '.assets[] | select(.name | test("^6\\.[0-9]+\\.[0-9]+\\.tar\\.gz$")) | .name' | \
              head -n 1 | sed 's/\.tar\.gz$//')
          [[ -z "${KERNEL_VER}" || "${KERNEL_VER}" == "null" ]] && {
              echo "Error: Failed to resolve kernel version from kernel_stable."
              exit 1
          }
          echo "Patched kernel version: ${KERNEL_VER}"
          echo "KERNEL_VER=${KERNEL_VER}" >> ${GITHUB_ENV}

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild with patched kernel
        uses: ./
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: p3-wxy4
          armbian_kernel: ${{ env.KERNEL_VER }}
          auto_kernel: false
          kernel_repo: opszhou/p3-armbian
          kernel_usage: stable
          armbian_fstype: ext4
          builder_name: ophub

      - name: Split firmware images
        id: split
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          set -e
          SPLIT_DIR="/builder/split"
          sudo mkdir -p "${SPLIT_DIR}" build/output/split
          sudo chown -R $(id -u):$(id -g) /builder

          # Source: the rebuilt full image (gzip)
          FULL_GZ=$(ls ${PACKAGED_OUTPUTPATH}/*.img.gz | head -n 1)
          [[ -e "${FULL_GZ}" ]] || { echo "Error: rebuilt image not found."; exit 1; }
          echo "Full image: ${FULL_GZ} ($(du -m ${FULL_GZ} | cut -f1)MB)"

          # Unzip to raw image
          gzip -dc "${FULL_GZ}" > "${SPLIT_DIR}/full.img"

          # Attach loop (runner needs sudo for loop devices)
          LOOP=$(sudo losetup -Pf --show "${SPLIT_DIR}/full.img")
          cleanup() { sudo losetup -d ${LOOP} 2>/dev/null || true; }
          trap cleanup EXIT
          sudo sfdisk -d "${LOOP}" > /tmp/layout || true
          echo "--- partition table ---"
          cat /tmp/layout

          # Parse partitions (partition name may be p1/1 depending on tooling)
          P1_START=$(grep -oP '^(?:\S+)?p?1\s*:\s*start=\s*\K\d+' /tmp/layout | head -1)
          P1_SIZE=$(grep  -P '^(?:\S+)?p?1\s*:' /tmp/layout | grep -oP 'size=\s*\K\d+' | head -1)
          P2_START=$(grep -oP '^(?:\S+)?p?2\s*:\s*start=\s*\K\d+' /tmp/layout | head -1)
          P2_SIZE=$(grep  -P '^(?:\S+)?p?2\s*:' /tmp/layout | grep -oP 'size=\s*\K\d+' | head -1)
          [[ -n "${P1_START}" && -n "${P2_START}" ]] || { echo "Error: partition parse failed."; exit 1; }
          echo "p1: start=${P1_START} size=${P1_SIZE} | p2: start=${P2_START} size=${P2_SIZE}"

          # Extract partitions, then content-verify which one is boot / rootfs
          sudo dd if=${LOOP} of="${SPLIT_DIR}/p1.img" bs=512 skip=${P1_START} count=${P1_SIZE} status=none
          sudo dd if=${LOOP} of="${SPLIT_DIR}/p2.img" bs=512 skip=${P2_START} count=${P2_SIZE} status=none
          sudo losetup -d ${LOOP}; trap - EXIT

          M=/mnt/split_check; sudo mkdir -p ${M}
          is_boot()  { sudo mount -o ro "$1" ${M} 2>/dev/null && sudo ls ${M}/extlinux/extlinux.conf >/dev/null 2>&1 && sudo umount ${M}; }
          is_root()  { sudo mount -o ro "$1" ${M} 2>/dev/null && sudo ls ${M}/etc/os-release >/dev/null 2>&1 && sudo umount ${M}; }
          if is_boot "${SPLIT_DIR}/p1.img"; then
              sudo mv ${SPLIT_DIR}/p1.img ${SPLIT_DIR}/02_boot.img
              sudo mv ${SPLIT_DIR}/p2.img ${SPLIT_DIR}/03_rootfs.img
          elif is_boot "${SPLIT_DIR}/p2.img"; then
              sudo mv ${SPLIT_DIR}/p2.img ${SPLIT_DIR}/02_boot.img
              sudo mv ${SPLIT_DIR}/p1.img ${SPLIT_DIR}/03_rootfs.img
          else
              echo "Error: cannot identify boot partition."; exit 1
          fi
          echo "02_boot mount OK";  sudo mount -o ro "${SPLIT_DIR}/02_boot.img" ${M} && sudo ls ${M}/extlinux/extlinux.conf && sudo umount ${M}
          echo "03_rootfs mount OK"; sudo mount -o ro "${SPLIT_DIR}/03_rootfs.img" ${M} && sudo ls ${M}/lib/modules/ && sudo ls ${M}/etc/os-release && sudo umount ${M}

          # 02/03 ownership for later steps
          sudo chown $(id -u):$(id -g) ${SPLIT_DIR}/02_boot.img ${SPLIT_DIR}/03_rootfs.img

          # ---- slim: assemble flashkit-layout full image (01 u-boot/GPT area + boot + rootfs) ----
          BOOT_START=32768; ROOT_START=819200
          BOOT_SECS=786432                      # 384MB, same as flashkit GPT
          ROOT_SECS=$(stat -c%s ${SPLIT_DIR}/03_rootfs.img | awk '{printf "%d", $1/512 + ($1%512?1:0)}')
          SLIM_SECS=$((ROOT_START + ROOT_SECS + 33))
          truncate -s $((SLIM_SECS * 512)) ${SPLIT_DIR}/slim.raw
          dd if=p3/flashkit/01_gpt_bootarea_l10h.img of=${SPLIT_DIR}/slim.raw conv=notrunc status=none
          dd if=${SPLIT_DIR}/02_boot.img  of=${SPLIT_DIR}/slim.raw bs=512 seek=${BOOT_START} conv=notrunc status=none
          dd if=${SPLIT_DIR}/03_rootfs.img of=${SPLIT_DIR}/slim.raw bs=512 seek=${ROOT_START} conv=notrunc status=none
          # Rewrite GPT to match the assembled size (backup GPT lands at file end)
          cd "${SPLIT_DIR}"
          sfdisk --force slim.raw <<PTABLE
          label: gpt
          unit: sectors
          slim.raw1 : start=${BOOT_START}, size=${BOOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="boot"
          slim.raw2 : start=${ROOT_START}, size=${ROOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="rootfs"
          PTABLE
          sfdisk -d slim.raw
          echo "slim assembled: $(du -m slim.raw | cut -f1)MB (rootfs ${ROOT_SECS} sectors)"
          gzip -k9 slim.raw && mv slim.raw.gz p3_armbian_slim.img.gz && rm slim.raw

          # ---- 01 bootloader pair (static, from repo) + checksums ----
          cp -v "${GITHUB_WORKSPACE}/p3/flashkit/01_gpt_bootarea_l10h.img" \
                "${GITHUB_WORKSPACE}/p3/flashkit/01_gpt_bootarea_l10g.img" \
                "${GITHUB_WORKSPACE}/p3/flashkit/p3boot" ./

          sha256sum 01_gpt_bootarea_l10h.img 01_gpt_bootarea_l10g.img p3boot 02_boot.img 03_rootfs.img p3_armbian_slim.img.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd - > /dev/null

          cp -f "${SPLIT_DIR}"/01_gpt_bootarea_l10h.img "${SPLIT_DIR}"/01_gpt_bootarea_l10g.img "${SPLIT_DIR}"/p3boot "${SPLIT_DIR}"/02_boot.img "${SPLIT_DIR}"/03_rootfs.img "${SPLIT_DIR}"/p3_armbian_slim.img.gz "${SPLIT_DIR}"/SHA256SUMS.txt build/output/split/
          echo "FIRMWARE_TAG=firmware_$(date +%Y.%m)" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload split firmware to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.split.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.FIRMWARE_TAG }}
          artifacts: build/output/split/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### P3 固件分镜像（L10 双模式套件，内核已含 HDMI/CEC/自愈）
            | 文件 | 用途 |
            |---|---|
            | 01_gpt_bootarea_l10h.img / _l10g.img | GPT + L10 引导（二选一：日常 l10h，反复刷机 l10g） |
            | 02_boot.img | boot 分区（补丁内核 + 修正魔数 dtb）`wl 0x8000` |
            | 03_rootfs.img | rootfs 分区 `wl 0xC8000` |
            | p3_armbian_slim.img.gz | U 盘整盘镜像（Rufus/Etcher 写入） |
            | p3boot | p3boot 辅助引导 |
            - 刷机命令与校验见 `p3/flashkit/README.md`
            - SHA256SUMS.txt 覆盖以上全部文件
